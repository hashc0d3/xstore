name: telegram-outbox

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: Send pending leads to Telegram
        env:
          LEADS_OUTBOX_SECRET: ${{ secrets.LEADS_OUTBOX_SECRET }}
          XSTORE_BOT: ${{ secrets.XSTORE_TELEGRAM_BOT_TOKEN }}
          XSTORE_CHAT: ${{ secrets.XSTORE_TELEGRAM_CHAT_ID }}
          SOTIK_BOT: ${{ secrets.SOTIK_TELEGRAM_BOT_TOKEN }}
          SOTIK_CHAT: ${{ secrets.SOTIK_TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          secret = os.environ["LEADS_OUTBOX_SECRET"]

          def req(url, data=None):
              headers = {"Authorization": f"Bearer {secret}"}
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=body, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          def send_telegram(token, chat, text):
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              payload = json.dumps({"chat_id": chat, "text": text}).encode()
              request = urllib.request.Request(
                  url, data=payload, headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          sites = [
              ("xstore55", "https://www.xstore55.ru/api/leads", os.environ["XSTORE_BOT"], os.environ["XSTORE_CHAT"]),
              ("sotik77", "https://www.sotik77.ru/api/leads", os.environ["SOTIK_BOT"], os.environ["SOTIK_CHAT"]),
          ]
          for name, base, token, chat in sites:
              outbox = req(f"{base}/outbox")
              leads = outbox.get("leads") or []
              sent_ids = []
              for lead in leads:
                  try:
                      result = send_telegram(token, chat, lead["text"])
                      if result.get("ok"):
                          sent_ids.append(lead["id"])
                      else:
                          print(name, "tg_fail", result)
                  except urllib.error.HTTPError as err:
                      print(name, "tg_http", err.code, err.read().decode())
              if sent_ids:
                  req(f"{base}/outbox/ack", {"ids": sent_ids})
              print(name, "pending", len(leads), "sent", len(sent_ids))
          PY
